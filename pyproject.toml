[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "advisory-offline-review"
version = "0.1.0"
description = "Bounded offline PyPI inventory to OSV snapshot PEP440 matching"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE*"]
dependencies = ["packaging==26.3"]

[project.scripts]
advisory-offline-review = "advisory_offline_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/advisory-offline-review" = ["ORIGIN.md", "DEFENSIVE_SCOPE.md", "VALIDATION.md", "SOURCE_REVIEW.json", "THIRD_PARTY.md", "requirements-runtime.lock"]
"share/advisory-offline-review/examples" = ["examples/inventory.json", "examples/snapshot.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
