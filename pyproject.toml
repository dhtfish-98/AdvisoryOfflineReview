[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
name = "advisory-offline-review"
version = "0.1.2"
description = "Bounded offline PyPI inventory to OSV snapshot PEP440 matching"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
dependencies = ["packaging==26.3"]

[project.scripts]
advisory-offline-review = "advisory_offline_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/advisory-offline-review" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "SOURCE_REVIEW.json", "项目文档/THIRD_PARTY.md", "requirements-runtime.lock", "SOURCE_REVIEW_MANIFEST.json"]
"share/advisory-offline-review/examples" = ["examples/inventory.json", "examples/snapshot.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
